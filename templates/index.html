{% extends "base.html" %}

{% block content %}
  <p>Hello, {{ name }}!</p>

<h2>Services</h2>
  <ul>
    {% for s in services %}
      <li>{{ s.name }}</li>
    {% endfor %}
  </ul>

  <h2>Tickets in the queue</h2>
  <ul class="tickets">
    {% for t in tickets %}
      <li><a href="{{ url_for('ticket', ticket_id=t['number']) }}">#{{ t['number'] }}</a></li>
    {% else %}
      <li>The queue is empty.</li>
    {% endfor %}
  </ul>
{% endblock %}
